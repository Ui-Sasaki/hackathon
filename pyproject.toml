[project]
name = "tasuke-no-wa-backend-mock"
version = "0.1.0"
description = "Frontend development mock API for Tasuke no Wa"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "anyio>=4.4,<4.10",
  "uvicorn[standard]>=0.30,<1",
  "supertokens-python>=0.31.3,<0.32",
  "asyncpg>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["main.py"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["backend_mock*", "tests*"]
